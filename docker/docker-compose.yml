services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: air-device/server
    ports:
      - '3000:3000'
    environment:
      # Optional: only needed when running more than one server instance
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: '*'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - air-device-net

  redis:
    image: redis:7-alpine
    container_name: air-device-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - '6379:6379'
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - air-device-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  air-device-net:
    driver: bridge
